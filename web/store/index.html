`;

let state = { page:"home", selectedTariff:2, email:"", agreed:false, paymentId:null };

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "cls") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (c == null) return;
    el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return el;
}

function makeHeader(mode) {
  const btns = [];
  if (mode === "home") {
    btns.push(h("a", {cls:"btn btn-accent", href:"#tariffs"}, "Купить"));
    btns.push(h("button", {cls:"btn btn-ghost", onClick:()=>navigate("login")}, "Личный кабинет"));
  } else {
    btns.push(h("button", {cls:"btn btn-ghost", onClick:()=>navigate("home")}, "На главную"));
  }
  return h("header", {cls:"hdr"},
    h("div", {cls:"hdr-in"},
      h("div", {cls:"logo", style:"cursor:pointer", onClick:()=>navigate("home")}, C.brand),
      h("div", {cls:"hdr-btns"}, ...btns),
    )
  );
}

function selectAndBuy(i) {
  state.selectedTariff = i;
  navigate("checkout");
}

function renderHome() {
  return [
    makeHeader("home"),

    h("section", {cls:"hero"},
      h("h1", null, C.hero_title),
      h("p", null, C.hero_sub),
      h("a", {cls:"btn btn-accent btn-lg", href:"#tariffs"}, "Выбрать тариф"),
    ),

    (function(){
      const statEls = [];
      const bar = h("section", {cls:"stats-bar"},
        h("div", {cls:"stats-bar-in"},
          ...C.stats.map((s, i) => {
            const valEl = h("div", {cls:"val"}, "0" + s.suffix);
            statEls.push({ el: valEl, idx: i, ...s });
            return h("div", {cls:"stat"},
              valEl,
              h("div", {cls:"label"}, s.label),
            );
          })
        )
      );
      function formatNum(n, sep, dec) {
        if (sep) return Math.floor(n).toLocaleString("ru");
        return dec ? n.toFixed(dec) : Math.floor(n).toString();
      }
      function animateStat(s, delay) {
        setTimeout(() => {
          const duration = 900;
          const start = performance.now();
          function tick(now) {
            const t = Math.min((now - start) / duration, 1);
            const ease = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
            const cur = s.num * ease;
            s.el.textContent = formatNum(cur, s.sep, s.dec) + s.suffix;
            if (t < 1) {
              requestAnimationFrame(tick);
            } else {
              s.el.textContent = formatNum(s.num, s.sep, s.dec) + s.suffix;
              s.el.classList.add("done");
            }
          }
          requestAnimationFrame(tick);
        }, delay);
      }
      const obs = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting) {
          statEls.forEach(s => animateStat(s, 0));
          obs.disconnect();
        }
      }, { threshold: 0.3 });
      requestAnimationFrame(() => obs.observe(bar));
      return bar;
    })(),

    (function(){
      let idx = 0;
      const total = C.features.length;
      const cards = C.features.map((f,i) =>
        h("div", {cls:"feat" + (i===0?" active":"")},
          h("img", {cls:"feat-img", src:f.img, alt:"", loading:"lazy"}),
          h("div", {cls:"feat-overlay"},
            h("h3", null, f.t),
            h("p", null, f.d),
          ),
        )
      );
      const track = h("div", {cls:"carousel-track"}, ...cards);
      const dots = C.features.map((_,i) =>
        h("button", {cls:"carousel-dot" + (i===0?" active":""), onClick:()=>go(i)})
      );
      function go(i) {
        idx = ((i % total) + total) % total;
        const wrap = track.parentElement;
        if (wrap && cards[0]) {
          const wrapW = wrap.offsetWidth;
          const cardW = cards[0].offsetWidth;
          const gap = 16;
          const offset = idx * (cardW + gap) - (wrapW - cardW) / 2;
          track.style.transform = "translateX(" + (-Math.max(0, offset)) + "px)";
        }
        cards.forEach((c,j) => c.className = "feat" + (j===idx?" active":""));
        dots.forEach((d,j) => d.className = "carousel-dot" + (j===idx?" active":""));
      }
      const section = h("section", {cls:"section"},
        h("h2", {cls:"section-title"}, "Почему выбирают нас"),
        h("div", {cls:"section-sub"}, "Всё необходимое для стабильного и безопасного интернета"),
        h("div", {cls:"carousel-wrap"},
          h("button", {cls:"carousel-nav carousel-prev", onClick:()=>go(idx-1), html:"&#8249;"}),
          h("button", {cls:"carousel-nav carousel-next", onClick:()=>go(idx+1), html:"&#8250;"}),
          track,
        ),
        h("div", {cls:"carousel-dots"}, ...dots),
      );
      let startX = 0, dragging = false;
      track.addEventListener("touchstart", e => { startX = e.touches[0].clientX; }, {passive:true});
      track.addEventListener("touchend", e => {
        const dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1));
      }, {passive:true});
      track.addEventListener("mousedown", e => { dragging = true; startX = e.clientX; track.style.cursor = "grabbing"; });
      window.addEventListener("mouseup", () => { dragging = false; track.style.cursor = ""; });
      track.addEventListener("mousemove", e => { if (dragging) e.preventDefault(); });
      track.addEventListener("mouseup", e => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1));
      });
      track.style.cursor = "grab";
      track.addEventListener("dragstart", e => e.preventDefault());
      requestAnimationFrame(() => requestAnimationFrame(() => go(0)));
      window.addEventListener("resize", () => go(idx));
      setInterval(() => go(idx+1), 5000);
      return section;
    })(),

    h("section", {cls:"tariffs-section", id:"tariffs"},
      h("h2", {cls:"section-title"}, "Выберите тариф"),
      h("div", {cls:"section-sub"}, "Разовая оплата без подписок и автоматических списаний"),
      h("div", {cls:"tariffs-wrap"},
        h("div", {cls:"tariffs"},
          ...C.tariffs.map((t,i) => {
            const sel = state.selectedTariff === i;
            const cls = "tariff" + (sel ? " selected" : "") + (t.popular ? " popular" : "");
            return h("div", {cls, onClick:()=>{state.selectedTariff=i;render()}},
              t.popular ? h("div", {cls:"tariff-badge"}, "Популярный") : null,
              h("h3", null, t.name),
              h("div", null,
                h("span", {cls:"price"}, t.price.toLocaleString("ru")),
                h("span", {cls:"price-currency"}, "\u2009\u20BD"),
              ),
              t.old_price ? h("span", {cls:"price-old"}, t.old_price.toLocaleString("ru") + "\u2009\u20BD") : null,
              t.duration_days > 30
                ? h("div", {cls:"per"}, Math.round(t.price / (t.duration_days/30)).toLocaleString("ru") + "\u2009\u20BD / мес")
                : null,
              h("div", {cls:"tariff-spacer"}),
              h("button", {cls:"buy-btn", onClick:(e)=>{e.stopPropagation();selectAndBuy(i)}}, "Купить"),
            );
          })
        )
      )
    ),

    h("section", {cls:"section"},
      h("h2", {cls:"section-title"}, "Как это работает"),
      h("div", {cls:"section-sub"}, "4 простых шага для подключения"),
      h("div", {cls:"steps"},
        ...C.steps.map(s =>
          h("div", {cls:"step"},
            h("div", {cls:"step-bg", html:'<svg viewBox="0 0 24 24">' + s.svg + '</svg>'}),
            h("div", {cls:"step-n"}, s.n),
            h("h3", null, s.t),
            h("p", null, s.d),
          )
        )
      )
    ),

    h("section", {cls:"section"},
      h("h2", {cls:"section-title"}, "Частые вопросы"),
      h("div", {cls:"faq-list"},
        ...C.faq.map(f => {
          const item = h("div", {cls:"faq-item"},
            h("div", {cls:"faq-q", onClick:()=>item.classList.toggle("open")},
              h("span", null, f.q),
              h("div", {cls:"faq-arrow"}, "+"),
            ),
            h("div", {cls:"faq-a"}, h("div", {cls:"faq-a-in"}, f.a)),
          );
          return item;
        })
      )
    ),

    h("footer", {cls:"footer"},
      h("div", {cls:"footer-in"},
        h("div", {cls:"footer-copy"}, "\u00A9 " + new Date().getFullYear() + " " + C.brand),
        h("div", {cls:"footer-links"},
          C.support ? h("a", {href:C.support, target:"_blank"}, "Поддержка") : null,
        )
      )
    ),
  ];
}

function renderCheckout() {
  const t = C.tariffs[state.selectedTariff] || C.tariffs[0];
  const errEl = h("div", {cls:"error", id:"form-err"});

  return [
    makeHeader("inner"),

    h("div", {cls:"checkout"},
      h("h2", null, "Оформление"),
      h("div", {cls:"sub"}, "Безопасный разовый платёж без привязки карты"),

      h("div", {cls:"summary"},
        h("div", null,
          h("div", {cls:"label"}, t.name),
        ),
        h("div", {cls:"val"},
          t.price.toLocaleString("ru"),
          h("span", null, "\u2009\u20BD"),
        ),
      ),

      h("div", {cls:"field"},
        h("label", null, "E-mail"),
        h("input", {type:"email", placeholder:"name@example.com", id:"email-input",
          value: state.email,
          onInput:(e)=>{state.email=e.target.value},
        }),
      ),

      h("div", {cls:"check"},
        h("input", {type:"checkbox", id:"agree-cb", ...(state.agreed?{checked:""}:{}),
          onChange:(e)=>{state.agreed=e.target.checked},
        }),
        h("label", {for:"agree-cb", html:"Подтверждаю, что ознакомился и согласен с&nbsp;условиями использования"}),
      ),

      errEl,

      h("button", {cls:"btn btn-accent btn-lg", style:"width:100%", onClick:async()=>{
        const email = state.email.trim();
        if (!email || !email.includes("@") || !email.includes(".")) {
          errEl.textContent = "Укажите корректный e-mail";
          errEl.style.display = "block";
          return;
        }
        if (!state.agreed) {
          errEl.textContent = "Необходимо принять условия использования";
          errEl.style.display = "block";
          return;
        }
        errEl.style.display = "none";
        await handlePurchase(t, email);
      }}, "Перейти к оплате"),

      h("div", {cls:"info-cards"},
        h("div", {cls:"info-card"},
          h("h4", null, "Разовая оплата"),
          h("p", null, "Без подписок и автоматических списаний. Карта не привязывается."),
        ),
        h("div", {cls:"info-card"},
          h("h4", null, "Для всех устройств"),
          h("p", null, "iPhone, Android, Mac, Windows и роутеры."),
        ),
        h("div", {cls:"info-card"},
          h("h4", null, "Гарантия возврата"),
          h("p", null, "Если сервис не работает — вернём деньги."),
        ),
      ),
    ),
  ];
}

function renderSuccess() {
  return [
    makeHeader("inner"),
    h("div", {cls:"success"},
      h("div", {cls:"success-icon"}, "\u2714"),
      h("h2", null, "Оплата прошла успешно"),
      h("p", null, "Конфигурация и инструкция отправлены на:"),
      h("p", {style:"color:var(--text);font-weight:600;font-size:17px"}, state.email),
      h("p", {style:"margin-top:28px;color:var(--text3);font-size:13px"}, "Проверьте папку \u00ABСпам\u00BB, если письмо не пришло в течение 5 минут."),
      h("button", {cls:"btn btn-ghost", style:"margin-top:28px", onClick:()=>navigate("home")}, "На главную"),
    ),
  ];
}

function renderWaiting() {
  return [
    makeHeader("inner"),
    h("div", {cls:"success"},
      h("div", {cls:"spinner"}),
      h("h2", null, "Ожидание оплаты"),
      h("p", null, "После подтверждения платежа конфигурация будет отправлена на:"),
      h("p", {style:"color:var(--text);font-weight:600"}, state.email),
    ),
  ];
}

function renderLogin() {
  const errEl = h("div", {cls:"error", id:"login-err"});
  return [
    makeHeader("inner"),
    h("div", {cls:"checkout"},
      h("h2", null, "Личный кабинет"),
      h("div", {cls:"sub"}, "Войдите, чтобы управлять подписками"),
      h("div", {cls:"field"},
        h("label", null, "E-mail"),
        h("input", {type:"email", placeholder:"name@example.com", id:"login-email",
          value: state.loginEmail || "",
          onInput:(e)=>{state.loginEmail=e.target.value},
        }),
      ),
      h("div", {cls:"field"},
        h("label", null, "Пароль"),
        h("input", {type:"password", placeholder:"Введите пароль", id:"login-pass",
          value: state.loginPass || "",
          onInput:(e)=>{state.loginPass=e.target.value},
        }),
      ),
      errEl,
      h("button", {cls:"btn btn-accent btn-lg", style:"width:100%;margin-top:8px", onClick:async()=>{
        const email = (state.loginEmail||"").trim();
        const pass = (state.loginPass||"");
        if (!email || !email.includes("@")) {
          errEl.textContent = "Укажите корректный e-mail";
          errEl.style.display = "block";
          return;
        }
        if (!pass) {
          errEl.textContent = "Введите пароль";
          errEl.style.display = "block";
          return;
        }
        errEl.style.display = "none";
        await handleLogin(email, pass, errEl);
      }}, "Войти"),
      h("div", {style:"text-align:center;margin-top:20px"},
        h("a", {href:"#", style:"color:var(--text3);font-size:13px", onClick:(e)=>{e.preventDefault();}}, "Забыли пароль?"),
      ),
    ),
  ];
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  let elements;
  switch(state.page) {
    case "checkout": elements = renderCheckout(); break;
    case "success":  elements = renderSuccess();  break;
    case "waiting":  elements = renderWaiting();  break;
    case "login":    elements = renderLogin();    break;
    default:         elements = renderHome();
  }
  elements.filter(Boolean).forEach(el => app.appendChild(el));
  app.classList.add("ready");
  if (state.page !== "home" || !location.hash) window.scrollTo(0,0);
}

function navigate(page) {
  state.page = page;
  render();
  window.scrollTo(0,0);
}

async function loadTariffs() {
  if (!C.api) return;
  try {
    const r = await fetch(C.api + "/api/store/tariffs");
    if (r.ok) {
      const data = await r.json();
      if (data.length) C.tariffs = data.map((t,i) => ({
        id: t.id, name: t.name, price: t.price_rub, old_price: null,
        duration_days: t.duration_days, badge: null, popular: i === Math.min(2, data.length-1),
      }));
    }
  } catch(e) {}
}

async function handleLogin(email, pass, errEl) {
  if (!C.api) { alert("Demo mode"); return; }
  try {
    const r = await fetch(C.api + "/api/auth/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ email, password: pass }),
    });
    if (r.status === 401) {
      errEl.textContent = "Неверный e-mail или пароль";
      errEl.style.display = "block";
      return;
    }
    const data = await r.json();
    if (data.identity_id && data.token) {
      localStorage.setItem("identity_id", data.identity_id);
      localStorage.setItem("token", data.token);
      navigate("cabinet");
    } else {
      errEl.textContent = data.detail || "Ошибка входа";
      errEl.style.display = "block";
    }
  } catch(e) {
    errEl.textContent = "Ошибка соединения";
    errEl.style.display = "block";
  }
}

async function handlePurchase(tariff, email) {
  if (!C.api) { navigate("success"); return; }
  try {
    const r = await fetch(C.api + "/api/store/purchase", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        email, tariff_id: tariff.id, provider_id: "YOOKASSA",
        success_url: location.origin + "/?ok=1",
      }),
    });
    const data = await r.json();
    if (data.payment_url) {
      state.paymentId = data.payment_id;
      window.location.href = data.payment_url;
    } else if (data.error) { alert(data.error); }
  } catch(e) { alert("Connection error"); }
}

async function checkReturnFromPayment() {
  const p = new URLSearchParams(location.search);
  if (p.get("ok") === "1") {
    state.page = "success";
    history.replaceState(null, "", location.pathname);
  }
}

async function init() {
  const s = document.createElement("style");
  s.textContent = css;
  document.head.appendChild(s);
  document.title = C.brand;
  await loadTariffs();
  await checkReturnFromPayment();
  render();
}

init();
})();
</script>
</body>
</html>
